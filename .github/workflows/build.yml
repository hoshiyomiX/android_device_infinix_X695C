name: Build OrangeFox Recovery

on:
  push:
    branches:
      - orangefox-*
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      of_branch:
        description: 'OrangeFox manifest branch'
        required: true
        default: '11.0'
        type: choice
        options:
          - 11.0
          - 12.1
      clean_build:
        description: 'Clean build'
        required: false
        default: false
        type: boolean

env:
  DEVICE: x695c
  MANIFEST_URL: https://gitlab.com/OrangeFox/Manifest.git

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Set environment variables
        run: |
          echo "DEVICE=x695c" >> $GITHUB_ENV
          echo "VENDOR=infinix" >> $GITHUB_ENV
          echo "OF_BRANCH=${{ github.event.inputs.of_branch || '11.0' }}" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf \
            imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev \
            libssl-dev libwxgtk3.0-gtk3-dev libxml2-utils lzop \
            pngcrush rsync schedtool squashfs-tools xsltproc \
            zip zlib1g-dev python3 openjdk-11-jdk

      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Cache OrangeFox source
        uses: actions/cache@v4
        with:
          path: ~/of
          key: of-${{ env.OF_BRANCH }}-${{ hashFiles('device_tree/BoardConfig.mk') }}
          restore-keys: of-${{ env.OF_BRANCH }}-

      - name: Initialize and sync
        run: |
          mkdir -p ~/of && cd ~/of
          repo init -u ${{ env.MANIFEST_URL }} -b ${{ env.OF_BRANCH }} --depth=1 || exit 1
          repo sync -j$(nproc) || repo sync -j$(nproc)

      - name: Setup device tree
        run: |
          cd ~/of
          mkdir -p device/${{ env.VENDOR }}/${{ env.DEVICE }}
          cp -r $GITHUB_WORKSPACE/device_tree/* device/${{ env.VENDOR }}/${{ env.DEVICE }}/

      - name: Build OrangeFox
        run: |
          cd ~/of
          . build/envsetup.sh
          lunch orangefox_${{ env.DEVICE }}-eng
          mka bootimage -j$(nproc)

      - name: Prepare artifacts
        run: |
          cd ~/of
          mkdir -p output
          [ -f out/target/product/${{ env.DEVICE }}/boot.img ] && cp out/target/product/${{ env.DEVICE }}/boot.img output/
          
          echo "## OrangeFox Build" > output/INFO.md
          echo "Device: ${{ env.DEVICE }} | Branch: ${{ env.OF_BRANCH }} | Date: $(date -u)" >> output/INFO.md
          
          mkdir -p $GITHUB_WORKSPACE/output
          cp -r output/* $GITHUB_WORKSPACE/output/
          ls -la output/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: orangefox-${{ env.DEVICE }}-${{ github.run_number }}
          path: ~/of/output/
          retention-days: 30

      - name: Upload to Release
        if: github.ref == 'refs/heads/orangefox-11' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: of-v1.0.${{ github.run_number }}
          name: OrangeFox ${{ env.DEVICE }} Build ${{ github.run_number }}
          body: |
            ## OrangeFox Recovery for Infinix X695C
            Branch: ${{ env.OF_BRANCH }}
            
            ### Flash
            ```
            fastboot flash boot_a boot.img
            fastboot flash boot_b boot.img
            fastboot reboot recovery
            ```
          files: ${{ github.workspace }}/output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
